# Apple TV 4K, 3rd generation (2022, models A2737 and A2843): A15 Bionic, 4 GB, GPU family Apple8.
# Play values measured by a tester's device benchmark report (H7C78EJ8): three easy scenes nobody played
# (b30's beach on Easy, the main menu, a10's opening), so nothing here is evidence about fights.
# A second report (NHC5Z2D5, Full suite) swept play at 1080, 1440 and 2160, filtering, shadows and model detail
# on the same beach: 1440 held 60 with 1 ms more GPU time than 1080, 2160 missed 60 and throttled the device
# within a minute, and filtering (2x to 16x), shadows (128 to 512) and model detail changed nothing. Play stays
# at 1080 until a fight is measured; the menu and cutscenes go to the display's own height.

schema = 1
name = "Apple TV 4K (3rd generation)"
kind = "model"
status = "provisional"

[match]
platform = "tvos"
models = ["AppleTV14,1"]
and_newer = true

[display]
upscaled_textures = true
render_scale = 1.0
shadow_map_size = 128
texture_idle_seconds = 60
model_lod = "max"
render_height = 1080
anisotropic_filtering = 16
dynamic_resolution = true
dynamic_resolution_floor = 720

[variable.display]
dynamic_resolution = true
dynamic_resolution_floor = 540

[network]
player_capacity = 128
full_rate_players = 6

[evidence."display.upscaled_textures"]
basis = "assumed"
why = "Steve's decision (2026-10-25): upscaled textures on the Apple TV 4K (3rd generation) and newer, off on the earlier Apple TVs (the class's value). Its A15 has the Neural Engine the upscaler needs and 4 GB of memory; the whole game's set takes about 655 MB of storage, kept in Library/Caches, which tvOS may purge between launches (it is then made again)."

[evidence."display.render_height"]
basis = "measured"
why = "At 1080 with 16x filtering, b30's beach on Easy with nobody playing ran 59.9 frames a second with every frame on time, GPU 15.0 ms a frame at the 95th percentile and 15.9 at worst; the menu 59.4; a10's opening, uncapped, 57.4. Three easy scenes only: not evidence about fights."
source = "device benchmark report H7C78EJ8 (a tester's Apple TV 4K, 3rd generation), 2026-10-14; proposal derive/atv4k3-proposal.toml"

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "16x, the highest, held the same numbers as the render height's (b30 beach 59.9 frames a second, all on time, GPU 95th percentile 15.0 ms). The only value tried; three easy scenes only."
source = "device benchmark report H7C78EJ8 (a tester's Apple TV 4K, 3rd generation), 2026-10-14"

# The main menu at the display's own height (2160 on a 4K output; on a smaller output the cap does nothing).
[scene.menu.display]
render_scale = 1.0
render_height = 2160

[evidence."scene.menu.display.render_height"]
basis = "measured"
why = "At 2160 the still menu held 59.9 frames a second with every frame on time, GPU 9.3 ms a frame (10.0 at worst); at 1440 it took 5.0 ms. A still menu only: nobody moved through the menus."
source = "device benchmark report NHC5Z2D5 (a tester's Apple TV 4K, 3rd generation, Full suite), 2026-10-14"

# Cutscenes at the display's own height, at 30 frames a second as the original played them.
[scene.cutscene.display]
render_scale = 1.0
render_height = 2160
frame_rate = "30"

[evidence."scene.cutscene.display.render_height"]
basis = "measured"
why = "a10's opening at 2160 with no cap ran 59.8 frames a second, GPU 11.4 ms a frame (15.8 at the 95th percentile, 32.2 at worst); capped at 30 it has more than twice that time. One cutscene only."
source = "device benchmark report NHC5Z2D5 (a tester's Apple TV 4K, 3rd generation, Full suite), 2026-10-14"

[evidence."scene.cutscene.display.frame_rate"]
basis = "assumed"
why = "Decided for every Apple TV: cutscenes play at the original's 30 frames a second, and the pixel budget that frees goes to resolution."
source = "the user's decision of 2026-10-13: 60 or more in play, 30 in cutscenes"

[evidence."display.render_scale"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."display.shadow_map_size"]
basis = "assumed"
why = "Steve 2026-11-04: all shadow maps are 128 texels except offline renders; the visual gain above 128 is small and the cost is large in big games."
source = "Steve, 2026-11-04"

[evidence."display.texture_idle_seconds"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."display.model_lod"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."scene.menu.display.render_scale"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."scene.cutscene.display.render_scale"]
basis = "assumed"
why = "Pinned to the built-in default so the Apple TV class profile's floor (the Apple TV HD's value) does not reach this model; not separately measured."

[evidence."network.full_rate_players"]
basis = "measured"
why = "At 60 frames a second, 1080 lines, 512 shadows and 2160 output, 6 players hold Blood Gulch at 99.99% and 99.97% and Sidewinder at 100% in both rounds. 8 players fail Sidewinder in three rounds (99.43%, 98.65%, 99.14%), and Blood Gulch falls to about 95% at 16 and 62% at 24. At 30 frames a second both maps hold 32."
source = "VISR toobig sweep and follow-up on Apple TV 4K (3rd generation), build from main e77a24957, Metal, Blood Gulch and Sidewinder, 2026-11-01"

[evidence."network.player_capacity"]
basis = "measured"
why = "At 30 frames a second, 540 lines and 128 shadows, 128 players, the highest tested, held 100% of frames on time on Blood Gulch and Sidewinder in two rounds each."
source = "VISR presented capacity ladder on Apple TV 4K (3rd generation), build from main e77a24957, 2026-11-01"

[evidence."variable.display.dynamic_resolution"]
basis = "measured"
why = "A 1080-line ceiling with dynamic resolution down to 540 held a minimum of 99.80% of frames on time at 60 frames a second through 2x enemies on a10 and d40."
source = "VISR context qualification on Apple TV 4K (3rd generation), build from main e77a24957, 2026-11-01"

[evidence."variable.display.dynamic_resolution_floor"]
basis = "measured"
why = "The same wide window, 1080 lines down to 540, passed; see `variable.display.dynamic_resolution`."
source = "VISR context qualification on Apple TV 4K (3rd generation), build from main e77a24957, 2026-11-01"

[evidence."display.dynamic_resolution"]
basis = "measured"
why = "Fixed at 1080 lines, 128 shadows and 60 frames a second, a50-hangar held only 66.2% of frames on time on 0.6.10 (72.8% on 0.6.8) with a median GPU time of 23.8 ms against a 16.7 ms budget, while the other campaign windows held 99.8% to 99.9% (c10, b30, b40-exta, b30-bot). The extra cost is fragment work in the hangar; the investigation found no code regression to fix. Dynamic resolution lets the planner drop only the hangar's frames to the lines they need and leaves the other windows at the 1080 ceiling."
source = "docs/benchmarks/results.csv, VISR 0.6.8 (2026-11-02) and 0.6.10 (2026-11-04) combat and campaign windows on Apple TV 4K (3rd generation); Steve 2026-11-04"

[evidence."display.dynamic_resolution_floor"]
basis = "measured"
why = "Presented a50-hangar on 0.6.10, two rounds each, alternating: with the window off, 43.1 and 48.1 frames a second with 68.0% and 81.6% of frames on time; with it on (floor 720), 56.1 and 53.9 with 98.5% and 89.7%. The planner settled at 720 from about frame 2400 to the end of both rounds and would have gone lower; at 720 the second round still ran 17.9 ms of GPU a frame against a 16.7 ms budget. The window lifts the hangar by about 19 points but does not yet hold it; a 540 floor (the ladder's minimum) would likely close the gap and is untested."
source = "presented a50-hangar pair on Apple TV 4K (3rd generation), VISR 0.6.10, 2026-11-05"