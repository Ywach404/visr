order = 10
heading = "Mac"
sub_heading = "Mac: CPU and GPU time"
sub_order = 15
paragraph = "Measured on {device} with the matched-stock settings and a 2560×1920 drawable, the frame cap and vsync off. Bars show median CPU time and median GPU time per frame in milliseconds, CPU above GPU for each build. Lower is better. A build that reports only one of the two is drawn with that bar alone; builds that report neither are listed as not reported. A build with no uncapped run is drawn from its display-locked run, marked in its label, with its settings named in the table."
empty = "No Mac CPU or GPU times are reported yet."
box = "M6 Mac mini"
needs_data = true
frame_cost = true
series_labels = ["Median CPU time", "Median GPU time"]

[chart]
type = "bar"
horizontal = true
title_unit = "CPU and GPU Frame Time (ms)"
x_label = "Port and version"
y_label = "Milliseconds per frame"
y_min = 0
palette = ["#1fa9d4", "#ffc24d"]
marks = ["\U0001F7E6", "\U0001F7E8"]
header = '''
---
config:
  xyChart:
    width: 520
    height: 290
  themeVariables:
    xyChart:
      plotColorPalette: "__PALETTE__"
---
'''

[query]
platform = "Mac"
metrics = ["cpu_p50_ms", "gpu_p50_ms"]
pair = true
details = ["cpu_p50_ms", "gpu_p50_ms", "gpu_p90_ms"]
port_order = ["visr", "opence-macos", "corece", "chupathingy", "halo-og", "openh1"]
no_data_reason = "CPU and GPU time per frame not reported"

[query.no_gpu_notes]
chupathingy = "GPU time per frame not available (OpenGL)"

[query.suite_windows]
campaign = ["c10", "b30"]
combat = ["a50-hangar", "b40-exta", "b30-bot"]
cutscenes = ["x70-bridge", "cutscene-rescue"]

[query.build_notes]
halo-og = "Limited by CPU command submission, not by a frame cap."
chupathingy = "OpenGL app, timed at its frame swap."

[query.filter]
frame_mode = "uncapped"
drawable = "2560×1920"
quality_preset = "matched-stock"
status = "ok"

# A port with no uncapped run on the device is drawn from its display-locked run at the same drawable size.
[query.fallback_filter]
frame_mode = "capped"
drawable = "2560×1920"
status = "ok"
