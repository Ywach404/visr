[query.no_gpu_notes]
chupathingy = "GPU time per frame not available (OpenGL)"

[query.suite_windows]
campaign = ["c10", "b30"]
combat = ["a50-hangar", "b40-exta", "b30-bot"]
cutscenes = ["x70-bridge", "cutscene-rescue"]

[query.build_notes]
halo-og = "Limited by CPU command submission, not by a frame cap."
